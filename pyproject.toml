[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-genome-analysis"
version = "1.2.0"
description = "Alignment-free architecture-aware analysis of curated plant DNA virus panels, including geometric embedding, validation, mosaicity, component concordance, and configuration tension."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "biopython>=1.83",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10"
]
keywords = ["viral genomes", "k-mers", "geometry", "permutation tests", "bioinformatics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
viral-genome-analysis = "viral_genome_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
